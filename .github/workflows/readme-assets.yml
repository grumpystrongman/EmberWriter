name: Generate README assets

on:
  workflow_dispatch:
  push:
    branches: [feature/readme-platform-polish]
    paths:
      - '.github/workflows/readme-assets.yml'
      - 'frontend/package.json'
      - 'frontend/scripts/capture-readme-screenshots.mjs'
      - 'scripts/seed_readme_demo.py'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e './backend[dev]'
      - name: Generate deterministic frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install temporary screenshot tooling
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium
      - name: Start API and seed documentation project
        env:
          EMBER_DATA_DIR: ${{ runner.temp }}/emberwriter-readme-data
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/emberwriter-readme-api.log 2>&1 &
          API_PID=$!
          echo "API_PID=$API_PID" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          python scripts/seed_readme_demo.py
      - name: Start UI and capture screenshots
        run: |
          cd frontend
          npm run dev -- --port 5173 > /tmp/emberwriter-readme-ui.log 2>&1 &
          UI_PID=$!
          echo "UI_PID=$UI_PID" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          node scripts/capture-readme-screenshots.mjs
      - name: Verify generated assets
        run: |
          test -s frontend/package-lock.json
          test -s docs/screenshots/01-write-workspace.png
          test -s docs/screenshots/02-story-atlas.png
          test -s docs/screenshots/03-visual-canon.png
          test -s docs/screenshots/04-character-studio.png
          test -s docs/screenshots/05-publishing-studio.png
          file docs/screenshots/*.png
      - name: Commit generated documentation assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Generate README screenshots and frontend lockfile"
            git push
          fi
      - name: Stop demo services
        if: always()
        run: |
          kill "${UI_PID:-}" 2>/dev/null || true
          kill "${API_PID:-}" 2>/dev/null || true
