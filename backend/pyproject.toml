[project]
name = "emberwriter-api"
version = "0.11.0"
description = "Local-first backend for EmberWriter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "ebooklib>=0.18,<1",
  "beautifulsoup4>=4.12,<5",
  "striprtf>=0.0.29,<1",
  "markdown>=3.7,<4",
  "reportlab>=4.2,<5",
  "Pillow>=11,<13"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
