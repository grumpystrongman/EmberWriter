name: Certified 5 of 5 Release Gate
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  strict-author-acceptance:
    name: Reject release unless every author and engineering gate is certified
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned build dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify entire 38-item scorecard catalog
        run: node scripts/verify_release_scorecard.mjs --catalog
      - name: Enforce the complete exact-commit 5/5 acceptance manifest
        run: node scripts/verify_release_scorecard.mjs --certify release/quality-evidence.json
      - name: Release decision
        run: echo 'All 38 quality gates have same-build independent review and verified artifacts.'
