name: Real model acceptance

on:
  push:
    branches:
      - test/rocinante-acceptance
  workflow_dispatch:

jobs:
  rocinante-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EMBER_AUTO_INSTALL_CREATIVE_MODEL: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    steps:
      - name: Check out acceptance candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install EmberWriter backend
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e './backend[dev]'

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve >/tmp/ollama-acceptance.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama-acceptance.log
          exit 1

      - name: Pull creative writing model
        run: ollama pull HammerAI/rocinante-v1.1:12b-q4_K_M

      - name: Confirm model installation
        run: ollama list

      - name: Run exact-prompt production-path acceptance
        run: python scripts/real_model_acceptance.py
