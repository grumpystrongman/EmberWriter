[project]
name = "emberwriter-api"
version = "0.15.0rc2"
description = "Local-first backend for EmberWriter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "ebooklib>=0.18,<1",
  "beautifulsoup4>=4.12,<5",
  "striprtf>=0.0.29,<1",
  "markdown>=3.7,<4",
  "reportlab>=4.2,<5",
  "Pillow>=13,<14",
  "msgpack>=1.1,<2"
]

[project.optional-dependencies]
# Optional offline voice engine. Model weights are installed per author locally,
# never downloaded as a dependency of opening or editing a manuscript.
kokoro = ["kokoro-onnx>=0.6.1,<0.7", "soundfile>=0.14,<1"]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.6,<1"
]

[tool.setuptools.package-data]
app = ["resources/*.dict", "resources/book-publishers-*.csv", "resources/CMUDICT-LICENSE"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["data", "data.*", "tests", "tests.*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Release-candidate lint debt is intentionally scoped to exact files.
# See docs/LINT_REVIEW.md. No global lint rules are disabled.
"app/atlas_hierarchy.py" = ['B023', 'F401']
"app/audio_production.py" = ['TRY004']
"app/audiobook_jobs.py" = ['BLE001', 'S110']
"app/audiobook_local.py" = ['TRY004']
"app/autopilot.py" = ['TRY004']
"app/book_jobs.py" = ['BLE001', 'S110']
"app/book_reviews.py" = ['TRY004']
"app/book_revisions.py" = ['TRY004']
"app/book_studio.py" = ['TRY004']
"app/continuity_audit.py" = ['SIM102']
"app/editorial_board.py" = ['RUF059', 'TRY004']
"app/editorial_pipeline.py" = ['BLE001']
"app/generation_reliability.py" = ['PLC0414']
"app/local_resources.py" = ['SIM115']
"app/m4b_jobs.py" = ['BLE001', 'S110']
"app/production_conductor.py" = ['BLE001', 'S110']
"app/production_preflight.py" = ['FLY002']
"app/proof_approval.py" = ['TRY004']
"app/prose_editor.py" = ['SIM102']
"app/routes_generation.py" = ['BLE001']
"app/routes_manuscript_intelligence.py" = ['B008']
"app/story_arc_investigator.py" = ['ISC004', 'TRY004']
"app/style_bible.py" = ['TRY004']
"app/voiceprint_lab.py" = ['TRY004']
"tests/test_audiobook_quality.py" = ['ASYNC221']
"tests/test_book_reviews.py" = ['SIM117']
"tests/test_book_revisions.py" = ['SIM117']
"tests/test_continuity_audit.py" = ['SIM117']
"tests/test_explicitness_enforcement.py" = ['I001']
"tests/test_release_proof_cast_noise.py" = ['SIM117']
"tests/test_story_arc_investigator.py" = ['SIM117']

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
  "error::starlette.exceptions.StarletteDeprecationWarning"
]
