name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e './backend[dev]'
      - run: python -m pip check
      - run: python -m compileall -q backend/app
      - name: Validate Windows PowerShell install and launch scripts
        run: pwsh -NoProfile -File scripts/validate-powershell.ps1
      - run: pytest backend/tests -q
      - run: ruff check backend/app backend/tests
      - name: Smoke-test API startup and health
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              response = client.get('/api/health')
              response.raise_for_status()
              payload = response.json()
              assert payload['ok'] is True
              assert payload['service'] == 'EmberWriter'
          PY
      - run: python -m pip install pip-audit
      - run: pip-audit --skip-editable

  studio-contract-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate code into a clean runner
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build isolated EmberWriter backend environment
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e './backend[dev]'
      - name: Exercise real Studio streaming route against scripted Ollama
        run: pytest backend/tests/test_studio_contract_e2e.py -q -vv
      - name: Prove Studio has an explicit streaming transport available
        run: |
          grep -q '/generate/stream' frontend/src/GenerationWatchdog.tsx
          grep -q 'STUDIO SCENE DELIVERY CONTRACT:' frontend/src/AIStudioWorkspace.tsx
          grep -q 'STUDIO CONTINUATION CONTRACT:' frontend/src/AIStudioWorkspace.tsx
      - name: Compile audited backend path
        run: python -m compileall -q backend/app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit complete frontend dependency tree
        run: npm audit --audit-level=moderate
        working-directory: frontend
      - name: Verify README screenshots
        run: |
          test -s docs/screenshots/01-write-workspace.png
          test -s docs/screenshots/02-story-atlas.png
          test -s docs/screenshots/03-visual-canon.png
          test -s docs/screenshots/04-character-studio.png
          test -s docs/screenshots/05-publishing-studio.png
          grep -q 'docs/screenshots/01-write-workspace.png' README.md
          grep -q 'docs/screenshots/02-story-atlas.png' README.md
          grep -q 'docs/screenshots/03-visual-canon.png' README.md
          grep -q 'docs/screenshots/04-character-studio.png' README.md
          grep -q 'docs/screenshots/05-publishing-studio.png' README.md
      - name: Build hosted production frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
      - name: Verify hosted API rewrite
        working-directory: frontend
        run: |
          if grep -R "127.0.0.1:8000/api" dist; then
            echo "Local API URL leaked into hosted production output."
            exit 1
          fi
          grep -R "https://api.example.invalid/api" dist >/dev/null
      - name: Enforce JavaScript chunk budget
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const dir = path.join('dist', 'assets')
          const limit = 500 * 1024
          const chunks = fs.readdirSync(dir)
            .filter((name) => name.endsWith('.js'))
            .map((name) => ({ name, bytes: fs.statSync(path.join(dir, name)).size }))
            .sort((a, b) => b.bytes - a.bytes)
          console.log(chunks.map(({ name, bytes }) => `${name}: ${(bytes / 1024).toFixed(1)} KiB`).join('\n'))
          const oversized = chunks.filter(({ bytes }) => bytes > limit)
          if (oversized.length) {
            console.error(`JavaScript chunk budget exceeded (${limit / 1024} KiB):`, oversized)
            process.exit(1)
          }
          NODE
      - name: Smoke-test production preview
        working-directory: frontend
        run: |
          npm run preview -- --port 4173 > /tmp/emberwriter-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/emberwriter-index.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /tmp/emberwriter-index.html
          grep -q '<div id="root"></div>' /tmp/emberwriter-index.html


  windows-author-safety:
    name: Windows manuscript, recovery and install acceptance
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend test requirements
        run: python -m pip install -e "./backend[dev]"
      - name: Exercise large synthetic novel and protected recovery on NTFS
        run: python -m pytest backend/tests/test_release_scale_qualification.py backend/tests/test_recovery_vault.py backend/tests/test_recovery_windows_junction.py backend/tests/test_release_qualification_manifest.py -q -rs
      - name: Validate release qualification rules and source integrity
        run: python -m ruff check backend/app backend/tests scripts/qualify_release.py scripts/qa_writer_only_install.py
      - name: Build the actual Pinokio-style same-origin Windows frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build
      - name: Refuse hosted bundles that connect to another local API port
        shell: pwsh
        run: |
          $files = Get-ChildItem frontend/dist/assets -Recurse -Filter '*.js'
          foreach ($file in $files) {
            if ([System.IO.File]::ReadAllText($file.FullName).Contains('http://127.0.0.1:8000/api')) {
              throw "Unsafe hosted API URL survived Windows rewrite: $($file.Name)"
            }
          }
          Write-Host "Windows hosted bundle uses same-origin API"
      - name: Clean-archive Windows writer-only install, export and restore
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/qa_windows_install.ps1
